name: meebo tracker

on:
  schedule:
    - cron: "*/20 * * * *"  # every 20 min; runs can lag under load
  workflow_dispatch:         # lets you trigger a check manually from the Actions tab
    inputs:
      test_notify:
        description: "Send a test push to your phone before checking"
        type: boolean
        default: false
      test_alarm:
        description: "Ring a test Pushover alarm before checking"
        type: boolean
        default: false

permissions:
  contents: write            # needed to commit state.json between runs

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # latest state.json, not the commit the run was queued on

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          X_RSS_FEEDS: ${{ secrets.X_RSS_FEEDS }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then python tracker.py --test-notify; fi
          if [ "${{ inputs.test_alarm }}" = "true" ]; then python tracker.py --test-alarm; fi
          python tracker.py --once

      - name: Save state
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "tracker state $(date -u +%FT%TZ)"
          git push || true

      # A dead-man's switch: healthchecks.io alerts if these pings stop arriving, which is the
      # only way to learn that runs stopped happening at all (expired token, GitHub outage).
      - name: Report to healthchecks.io
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          [ -n "$HEALTHCHECK_URL" ] || exit 0
          if [ "${{ job.status }}" = "success" ]; then path=""; else path="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL$path" || true
