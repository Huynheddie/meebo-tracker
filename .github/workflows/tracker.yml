name: meebo tracker

on:
  schedule:
    - cron: "*/20 * * * *"  # every 20 min; runs can lag under load
  workflow_dispatch:         # lets you trigger a check manually from the Actions tab
    inputs:
      test_notify:
        description: "Send a test push to your phone before checking"
        type: boolean
        default: false

permissions:
  contents: write            # needed to commit state.json between runs

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          X_RSS_FEEDS: ${{ secrets.X_RSS_FEEDS }}
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then python tracker.py --test-notify; fi
          python tracker.py --once

      - name: Save state
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "tracker state $(date -u +%FT%TZ)"
          git push || true
